<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math · Brendan D'Aquino</title>
  <link rel="stylesheet" href="/style.css">

  <!-- math rendering (KaTeX) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
        ],
      });
    });
  </script>
</head>
<body>
  <header>
    <a href="/">home</a> · <a href="/blog/">blog</a>
  </header>
  <main>
    <article>
      <h1>Math example</h1>
      <time datetime="2026-10-11">October 11, 2026</time>

      <p>Here's some inline math: $y = x^2$. And some display math:</p>

      $$
      \begin{equation}
      \frac{1}{2} = \frac{2}{4}.
      \end{equation}
      $$
    </article>
  </main>
</body>
</html>
