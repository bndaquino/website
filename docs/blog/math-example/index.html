<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math example · Brendan D'Aquino</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
        ],
      });
    });
  </script>
</head>
<body>
  <header>
    <a href="/">home</a> · <a href="/blog/">blog</a>
  </header>
  <main>
<article>
<h1>Math example</h1>
<time datetime="2026-10-11">October 11, 2026</time>
<p>Here's some inline math: $y = x^2$. And some display math:</p>
<p>$$
\begin{equation}
\frac{1}{2} = \frac{2}{4}.
\end{equation}
$$</p>
<p>Below is a parabola.</p>
<figure>
  <img src="plot.svg" alt="Graph of the parabola y = x squared for x from -2 to 2">
  <figcaption>This is a caption with some math: $y = x^2$.</figcaption>
</figure>

<p>Some more: $\{1,2,3\}$.</p>
</article>
  </main>
</body>
</html>
